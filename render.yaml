# Render Blueprint: one always-on web service with a small disk for the database.
# Secrets are not stored here: Render asks for the sync: false ones when you create the service.
services:
  - type: web
    name: receptionist
    runtime: python
    region: oregon            # closest to Retell's servers (US West)
    plan: starter             # the free plan sleeps when idle, which would make the first call very slow
    buildCommand: pip install -r requirements.txt
    startCommand: python -m receptionist serve --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: RECEPTIONIST_DATA_DIR
        value: /var/data
      - key: PUBLIC_BASE_URL          # the links in owner emails point here
        value: https://receptionist-575z.onrender.com
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RETELL_API_KEY
        sync: false
      - key: RETELL_WS_SECRET
        sync: false
      - key: DASHBOARD_TOKEN
        sync: false
      - key: TOKEN_SECRET
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      # Owner and admin email (Gmail with an app password works with no domain; leave blank to send nothing).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      # Off-box backups (any S3-compatible bucket); leave blank to rely on Render's disk snapshots.
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET
        sync: false
      - key: BACKUP_S3_REGION
        sync: false
      - key: BACKUP_S3_ENDPOINT
        sync: false
    disk:
      name: receptionist-data
      mountPath: /var/data
      sizeGB: 1

  # Fires the discovery caller once each weekday morning. Cron services have no disk of their own, so this just
  # calls the web service's admin endpoint, which does the real work (picks the next eligible lead from the file on
  # /var/data and dials it). 16:00 UTC is 8:00 AM Pacific in winter and 9:00 AM in summer (cron schedules are always
  # UTC, so this drifts an hour across the DST change) -- both are inside outbound.call_hours (08:00-18:00 local), so
  # a lead never gets called before the shop's own opening-hours gate would allow it anyway.
  - type: cron
    name: outbound-caller-trigger
    runtime: python
    region: oregon
    plan: starter
    schedule: "0 16 * * 1-5"   # Mon-Fri, UTC
    buildCommand: "true"
    startCommand: 'code=$(curl -sS -o /tmp/out.txt -w "%{http_code}" -X POST "$TARGET_URL/admin/outbound/call-next" -H "Authorization: Bearer $DASHBOARD_TOKEN"); echo "status $code"; head -c 600 /tmp/out.txt; echo; [ "$code" -lt 400 ]'
    envVars:
      - key: TARGET_URL
        value: https://receptionist-575z.onrender.com
      - key: DASHBOARD_TOKEN
        sync: false   # set this to the SAME value as the web service's DASHBOARD_TOKEN
