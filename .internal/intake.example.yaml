# Example intake for `python -m receptionist new-client --from intake.yaml`
template: lawn_care                  # which demo shop to start from: hvac or lawn_care
shop_name: Example Lawn & Snow
owner_cell: "208-555-0100"          # the shop owner's cell; the agent can try it for emergencies
owner_email: "owner@example.test"   # every call is emailed here (several: a comma-separated list)
avg_job_value: 450                   # dollars; the weekly report multiplies it by jobs booked (an estimate)
our_number: ""                       # the number the shop forwards to; fill in once assigned
towns: [Sandpoint, Ponderay, Sagle, Dover, Kootenai]
hours:                               # 24-hour times, or null for closed (or use "weekdays 7-5, sat 8-12")
  mon: "07:00-17:00"
  tue: "07:00-17:00"
  wed: "07:00-17:00"
  thu: "07:00-17:00"
  fri: "07:00-17:00"
  sat: "08:00-12:00"
  sun: null
services: [lawn_mowing, spring_cleanup, aeration_overseeding, irrigation_startup, irrigation_winterization, fall_leaf_cleanup, snow_removal_seasonal, estimate_visit]
prices:
  - "Estimates are free; the crew confirms the price on site before any work starts."
approved_tips:
  - "a sprinkler system that won't shut off: You can turn off the water to the sprinkler system at its main shutoff valve."
faqs:
  - "What payment methods do you take: Cards, checks and cash, paid to the crew lead at the end of the job."
