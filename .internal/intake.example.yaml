hours:                               # 24-hour times, or null for closed (or use "weekdays 7-5, sat 8-12")
  mon: "07:00-17:00"
  tue: "07:00-17:00"
  wed: "07:00-17:00"
  thu: "07:00-17:00"
  fri: "07:00-17:00"
  sat: "08:00-12:00"
  sun: null
services: [furnace_repair, boiler_repair, heat_pump, ac_repair, hvac_tune_up, water_heater, leak_repair, drain_cleaning, estimate]
prices:
  - "Service visits have a $95 diagnostic fee, waived if the customer approves the repair."
approved_tips:
  - "a furnace that won't come on: You can check that the thermostat is set to heat and its batteries aren't dead."
faqs:
  - "What payment methods do you take: Cards, checks and cash, paid to the technician at the end of the job."
